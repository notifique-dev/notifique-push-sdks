name: Publish npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm (manual runs only)'
        required: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm manual publish
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'PUBLISH'
        run: |
          echo "Refusing to publish without confirmation"
          exit 1
      - uses: actions/checkout@v4
      - name: Require release tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags --force
          git describe --exact-match --tags HEAD || (echo "Select a release tag like v0.2.0" && exit 1)

  npm-web:
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install && npm run build && npm test && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-rn:
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install && npm run build && npm test && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-server:
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install && npm run build && npm test && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
